<title>Révisions ESSEC MiM 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Mise en page : barre latérale fixe (navigation + cours) et zone de travail ; en dessous de 1000 px, barre du haut ; sur téléphone, barre d'onglets en bas.
   Thème clair unique, choisi délibérément (pas de thème sombre). */
:root{
  color-scheme:light;
  --bg:#F3F4F6; --surface:#FFFFFF; --sunken:#F8F9FA; --ink:#141820; --ink2:#3B4250; --muted:#6A7180; --line:#E2E5EA; --line2:#ECEEF2;
  --brand:#1A2540; --brand-ink:#FFFFFF; --hover:#F1F3F6;
  --good:#1D7A4E; --good-bg:#E6F4EC; --bad:#B4322E; --bad-bg:#FBEAE9; --warn:#97600C; --warn-bg:#FAF0DC; --hl:#FFF0A8;
  --c-mm:#B8355E; --c-acc:#2F4BC4; --c-it:#0B7A6B; --c-law:#A1561A; --c-str:#6A44BC; --c:var(--brand);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:7px;
  --side:252px;
  --shadow:0 1px 2px rgba(20,24,32,.04),0 1px 1px rgba(20,24,32,.03);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
mark{background:var(--hl);color:inherit;padding:0 .12em;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- Coque de l'application ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px 8px 18px}
.brand .mk{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 13px var(--mono);letter-spacing:.02em}
.brand b{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted)}
.sgrp{margin-top:14px}
.sgrp>.lbl{display:block;padding:0 10px 6px}
.snav{display:flex;flex-direction:column;gap:1px}
.snav a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:7px 10px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink2)}
.snav a:hover{background:var(--hover);color:var(--ink)}
.snav a.on{background:var(--brand);color:var(--brand-ink)}
.snav a.on .cnt{color:rgba(255,255,255,.75)}
.snav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.snav .sq{width:10px;height:10px;border-radius:3px;flex:none;margin:0 3px}
.snav .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav .cnt{font:500 12px var(--mono);color:var(--muted)}
.snav .badge{font:600 11px var(--mono);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.sfoot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line2)}
.sfoot .row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sfoot .row2 b{color:var(--ink2);font-weight:600}
.shell{margin-left:var(--side);min-height:100%}
main{max-width:1120px;margin:0 auto;padding:32px 36px 72px}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:999px){
  .side{display:none}
  .shell{margin-left:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;gap:14px;padding:8px 20px}
  .topbar .brand{padding:0}
  .topnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .topnav a{white-space:nowrap;text-decoration:none;padding:7px 11px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:7px}
  .topnav a.on{background:var(--brand);color:#fff}
  .topnav .sq{width:9px;height:9px;border-radius:3px}
  main{padding:26px 22px 64px}
}
@media (max-width:760px){
  .topnav{display:none}
  .topbar{padding:10px 16px}
  main{padding:20px 16px 96px}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 0;border-radius:8px}
  .tabbar a.on{color:var(--brand);background:var(--hover)}
  .tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tabbar .sq{width:12px;height:12px;border-radius:4px;margin:4px}
}
.view{animation:in .22s ease both}
@keyframes in{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view,.pop,.shake,.fcard{animation:none!important;transition:none!important}}

/* ---------- Composants ---------- */
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card{padding:22px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.ph h2{font-size:15px;font-weight:600}
.ph a{font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none}
.ph a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--brand);color:#fff;font-weight:600;padding:9px 16px;border-radius:var(--r-sm);font-size:14px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{filter:brightness(1.12)}
.btn.c{background:var(--c)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:5px;padding:2px 8px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.red{background:var(--bad-bg);color:var(--bad)} .pill.amb{background:var(--warn-bg);color:var(--warn)} .pill.grn{background:var(--good-bg);color:var(--good)}
.bar{height:5px;background:var(--line2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s ease}
.ring{width:var(--s,74px);height:var(--s,74px);position:relative;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line2)} .ring .fg{stroke:var(--c);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 var(--fs,16px) var(--mono)}
.seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.seg a{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:13.5px;color:var(--muted);text-decoration:none}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,32,.1)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--ink)}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--sunken)}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--line2) 25%,var(--sunken) 50%,var(--line2) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* ---------- En-têtes de page ---------- */
.hello,.pgh{margin-bottom:24px}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow a{text-decoration:none}
.eyebrow a:hover{color:var(--ink)}
.hello h1,.pgh h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.01em}
.hello p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.hello p b{color:var(--bad);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink2);font-weight:500}

/* ---------- Tableau de bord ---------- */
.nextc{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:20px;text-decoration:none}
.nextc:hover{background:var(--sunken)}
.nextc .sq{width:12px;height:12px}
.nextc .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nextc b{font-size:17px;font-weight:600}
.nextc small{font-size:13.5px;color:var(--muted)}
.nextc .go{font-size:20px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
.kpi{padding:16px 20px;border-left:1px solid var(--line2);min-width:0;display:flex;flex-direction:column;gap:4px;text-decoration:none}
.kpi:first-child{border-left:0}
a.kpi:hover{background:var(--sunken)}
.kpi .v{font-size:20px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v.sm{font-size:15px;line-height:1.35}
.kpi .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s.hot{color:var(--bad);font-weight:600}
.kpi .bar{margin-top:6px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line2)}}
.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1320px){.dash{grid-template-columns:minmax(0,1fr)}}
.ctab{width:100%;border-collapse:collapse}
.ctab th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;border-bottom:1px solid var(--line2);white-space:nowrap}
.ctab td{padding:13px 18px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:14px}
.ctab tr:last-child td{border-bottom:0}
.ctab tbody tr{cursor:pointer}
.ctab tbody tr:hover td{background:var(--sunken)}
.cn{display:flex;align-items:center;gap:11px;min-width:0}
.cn a{text-decoration:none;font-weight:600;color:var(--ink);white-space:nowrap}
.cn small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.prog{display:flex;align-items:center;gap:10px;min-width:130px}
.prog .bar{flex:1}
.prog .mono{font-size:12.5px;color:var(--ink2);width:36px;text-align:right}
.qa{display:flex;gap:4px}
.qa a{font-size:12.5px;font-weight:500;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface)}
.qa a:hover{border-color:var(--c);color:var(--c)}
@media (max-width:760px){.ctab .hide-sm{display:none}.ctab td,.ctab th{padding:12px 14px}}
.up{list-style:none;margin:0;padding:4px 0}
.up li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:10px 18px;align-items:start}
.up li+li{border-top:1px solid var(--line2)}
.up .dt{text-align:center;line-height:1.1;padding-top:2px}
.up .dt b{display:block;font:600 18px var(--mono);color:var(--ink)}
.up .dt small{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.up .tx{min-width:0;font-size:14px;line-height:1.4}
.up .tx small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:3px;flex-wrap:wrap}
.qacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ---------- Matière ---------- */
.tabsrow{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:0 0 22px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{white-space:nowrap;text-decoration:none;padding:10px 12px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--c);font-weight:600}
@media (max-width:999px){.tabsrow{top:calc(env(safe-area-inset-top,0px) + 51px)}}
.mast{display:flex;align-items:center;gap:10px;min-width:220px}
.mast .bar{flex:1;max-width:160px}
.pgh{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}
.pgh .t{min-width:0;flex:1}
.src{font-size:13.5px;color:var(--muted);margin:-6px 0 18px;max-width:80ch}
.chl{list-style:none;margin:0;padding:0}
.chl li+li{border-top:1px solid var(--line2)}
.chl a{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 18px;text-decoration:none}
.chl a:hover{background:var(--sunken)}
.chl .n{font:600 13px var(--mono);color:var(--c)}
.chl b{font-weight:600;font-size:15px}
.chl small{font-size:13px;color:var(--muted);white-space:nowrap}
.chl .go{color:var(--muted)}
.pend{font-size:13.5px;color:var(--muted);margin:14px 2px 0}
.refnote{background:var(--warn-bg);color:var(--ink2);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.reader{max-width:780px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rtop .bar{flex:1;min-width:120px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px clamp(18px,4.5vw,48px);box-shadow:var(--shadow);font-size:16px;line-height:1.7}
.doc h2{font-family:var(--serif);font-size:clamp(23px,3vw,28px);font-weight:700;margin-bottom:18px;letter-spacing:-.005em}
.doc h4{font-size:17px;font-weight:600;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:1.3em}
.doc li{margin:5px 0}
.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0 16px;display:block;overflow-x:auto}
.doc th{background:var(--sunken);text-align:left;padding:8px 11px;font-weight:600;border:1px solid var(--line)}
.doc td{padding:8px 11px;border:1px solid var(--line);vertical-align:top}
.doc .f{font:13.5px/1.75 var(--mono);background:var(--sunken);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:12px 16px;margin:12px 0;white-space:pre-wrap;overflow-x:auto}
.doc .ex{background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:14px 18px;margin:14px 0;font-size:15px}
.doc .ex table{background:var(--surface)}
.doc .key{background:var(--good-bg);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15px}
.doc .warn{background:var(--warn-bg);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15px}
.doc .note{color:var(--muted);font-size:14.5px;background:var(--sunken);border-radius:6px;padding:8px 12px}
.doc .exo{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0;background:var(--surface)}
.doc .exh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px}
.doc .exh b{font-size:16px;font-weight:600}
.doc .exsrc{font-size:12.5px;color:var(--muted)}
.doc .cg{font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 8px;margin-left:auto}
.doc .cg.off{background:var(--good-bg);color:var(--good)} .doc .cg.prop{background:var(--warn-bg);color:var(--warn)}
.doc details.cor{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.doc details.cor>summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--c);padding:4px 0;list-style:none}
.doc details.cor>summary::before{content:"▸ ";} .doc details.cor[open]>summary::before{content:"▾ ";}
.doc details.cor>div{padding-top:6px}
.doc .cgnote{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.rnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* Essentiel et Infos */
.ess{max-width:780px;display:flex;flex-direction:column;gap:12px}
.es{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.esh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.esh .n{font:600 12.5px var(--mono);color:var(--c)}
.esh h3{font-size:16px;flex:1}
.es ul{margin:0;padding-left:1.15em}
.es li{margin:6px 0;line-height:1.55}
.es li.fm{list-style:none;margin-left:-1.15em;font:13.5px/1.6 var(--mono);background:var(--sunken);border-left:3px solid var(--c);border-radius:6px;padding:6px 12px}
.evl{list-style:none;padding:0!important}
.evl li{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line2)}
.evl li:last-child{border-bottom:0}
.evl .mono{color:var(--muted);font-size:12.5px;min-width:120px}
.es .pdfs{max-width:none}
.pdfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;max-width:780px}
.pdf{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-decoration:none}
.pdf:hover{border-color:var(--c)}
.pdf .ico{width:38px;height:46px;border-radius:5px;background:var(--c);color:#fff;font:600 10.5px var(--mono);display:grid;place-items:end center;padding-bottom:6px;flex:0 0 auto}
.pdf b{font-weight:600}
.pdf small{display:block;color:var(--muted);font-size:13px}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cb h3{font-size:16px;color:var(--c);margin-bottom:8px}
.cb ul{margin:0;padding-left:1.1em;font-size:14.5px}
.cb li{margin:4px 0}

/* ---------- Devoirs ---------- */
.dvl{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.dvlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:24px}
.dvi{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.dvi:hover{border-color:#C9CED7}
.dvi.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.dvi.past{opacity:.55}
.dvi-d{text-align:center;line-height:1.05}

/* ---------- QCM ---------- */
let quiz=null,pending=null;

  const el=$("#qz");

   <button class="qs" data-go="quick"><span class="big">10</span><b>Série rapide</b><span>Questions au hasard, correction immédiate</span></button>
   <button class="qs" data-go="new"><span class="big">${neverOk.length}</span><b>Pas encore réussies</b><span>Pour couvrir tout le programme</span></button>
   <button class="qs" data-go="err" ${err.length?"":"disabled style='opacity:.5'"}><span class="big">${err.length}</span><b>Mes erreurs</b><span>Les questions ratées la dernière fois</span></button></div>
  <details class="more"><summary>Personnaliser (chapitres, nombre, mode examen)</summary><div class="in">

   <div class="row"><button class="btn c" id="qgo">Commencer</button><span class="muted" id="qinfo"></span></div></div></details>
  <p class="muted" style="font-size:13.5px;margin-top:14px">Raccourcis : <span class="kbd">1</span>–<span class="kbd">4</span> pour répondre, <span class="kbd">Entrée</span> pour continuer.</p>`;

  el.querySelectorAll("#qm button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;el.querySelectorAll("#qm button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#qgo").onclick=()=>{let p=shuffle(pool());if(n)p=p.slice(0,n);go(p,{mode})};
  upd();

function startQuiz(items,o){quiz={items,i:0,ans:items.map(()=>null),mode:o.mode||"train",title:o.title||"QCM",done:false,t0:Date.now(),limit:o.limit||(o.mode==="exam"?items.length*75:0),streak:0,best:0};clearInterval(window._tm)}
const Q=k=>{const [s,i]=quiz.items[k];return {s,i,q:DATA[s].qcm[i]}};
function record(k){const {s,i,q}=Q(k);const ok=quiz.ans[k]===q[3];const id=s+":"+i;const st=qstat[id]||{n:0,ok:0};st.n++;if(ok)st.ok++;st.last=ok?1:0;qstat[id]=st;saveQ()}
function drawQuiz(el){
  el=el||$("#qz");if(!el)return;

  <div class="qcard" id="qc"><div class="qchap">${esc(BY[s].short)} · ${esc(chap)}</div><p class="qtext">${esc(q[1])}</p>
  <div class="opts">${q[2].map((o,j)=>{let c="";if(shown){if(j===q[3])c="right";else if(j===a)c="wrong"}else if(a===j)c="sel";return `<button class="opt ${c}" data-o="${j}" ${shown?"disabled":""}><span class="l">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
  ${shown?`<div class="expl">${a===q[3]?'<b class="ok">Bonne réponse.</b>':`<b class="ko">Réponse : ${"ABCD"[q[3]]}.</b>`} ${esc(q[4])}</div>`:""}</div>
  <div class="qfoot"><button class="btn ghost" id="qp" ${k===0?"disabled":""}>←</button>${quiz.mode==="exam"?`<span class="muted">${quiz.ans.filter(x=>x!==null).length}/${n} répondues</span>`:""}<button class="btn c" id="qn2" ${quiz.mode==="train"&&a===null?"disabled":""}>${k+1<n?"Suivante →":(quiz.mode==="exam"?"Rendre la copie":"Voir le résultat")}</button></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.o));

}
function choose(j){const k=quiz.i;if(quiz.mode==="train"&&quiz.ans[k]!==null)return;quiz.ans[k]=j;

   <p class="muted" style="margin:0 0 14px">${(p*20).toFixed(1).replace(".",",")}/20${quiz.best>=3?` · meilleure série ${quiz.best}`:""}${quiz.time?` · ${Math.floor(quiz.time/60)} min ${quiz.time%60} s`:""}</p>
   <div style="text-align:left">${Object.values(by).map(b=>`<div class="chaprow"><span>${esc(Object.fromEntries(DATA[b.s].chapters)[b.c])}</span><div class="bar"><i style="width:${b.ok/b.n*100}%;background:${b.ok/b.n>=.7?"var(--good)":b.ok/b.n>=.4?"var(--warn)":"var(--bad)"}"></i></div><span class="mono">${b.ok}/${b.n}</span></div>`).join("")}</div>

document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;

/* ---------- Cartes (Leitner) ---------- */
let fcQ=[],fcI=0,fcF=false,fcS=null;
function cardsTab(s){fcS=s.id;fcQ=shuffle(s.cards.map((c,i)=>i)).sort((a,b)=>(cbox[s.id+":"+a]||0)-(cbox[s.id+":"+b]||0));fcI=0;fcF=false;drawCards()}
function drawCards(){
  const s=DATA[fcS],el=$("#fc");if(!el)return;const bx=[0,1,2,3,4,5].map(b=>s.cards.filter((c,i)=>(cbox[s.id+":"+i]||0)===b).length);
  const boxes=`<div class="boxes">${["Nouv.","B1","B2","B3","B4","B5"].map((l,k)=>`<div><b>${bx[k]}</b>${l}</div>`).join("")}</div>`;
  if(fcI>=fcQ.length){el.innerHTML=`<div class="fcw card" style="text-align:center"><h2>Série terminée</h2><p class="muted">${known(s.id)} cartes sur ${s.cards.length} sont en boîte 4 ou 5.</p><button class="btn c" id="again">Nouvelle série</button>${boxes}</div>`;$("#again").onclick=()=>cardsTab(s);return}
  const i=fcQ[fcI],c=s.cards[i],b=cbox[s.id+":"+i]||0;
  el.innerHTML=`<div class="fcw"><div class="qhead"><span class="mono">${fcI+1}/${fcQ.length}</span><div class="bar"><i style="width:${fcI/fcQ.length*100}%"></i></div></div>
  <div class="flip"><div class="fcard ${fcF?"on":""}" id="fcard" tabindex="0" role="button" aria-label="Retourner la carte"><div class="face"><span class="lbl">Question</span><span class="pill">${b?"Boîte "+b:"Nouvelle"}</span><p>${esc(c[0])}</p></div><div class="face back"><span class="lbl">Réponse</span><p>${esc(c[1])}</p></div></div></div>
  ${fcF?`<div class="rate"><button class="no" data-r="1">À revoir <span class="kbd">1</span></button><button class="mid" data-r="2">Presque <span class="kbd">2</span></button><button class="yes" data-r="3">Je savais <span class="kbd">3</span></button></div>`:`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn c" id="show">Voir la réponse</button><span class="muted">ou <span class="kbd">Espace</span></span></div>`}${boxes}</div>`;
  $("#fcard").onclick=flip;const sh=$("#show");if(sh)sh.onclick=flip;el.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>rate(+x.dataset.r));
}
function flip(){fcF=!fcF;const c=$("#fcard");if(c&&fcF){c.classList.add("on");setTimeout(drawCards,260)}else drawCards()}
function rate(r){if(!fcF)return;const k=fcS+":"+fcQ[fcI],b=cbox[k]||0;cbox[k]=r===1?1:r===2?Math.max(1,b):Math.min(5,b+1);saveC();if(r===1)fcQ.push(fcQ[fcI]);fcI++;fcF=false;drawCards()}

/* ---------- Examen blanc et erreurs ---------- */
function examPage(){
  const e=allErr();
  return `<div class="hello"><div class="eyebrow">Entraînement</div><h1>Examen blanc</h1><p>Questions tirées au hasard, chronométrées, corrigées à la fin.</p></div>
  <div id="qz"><div class="qstart" style="margin-top:22px">
   ${SUBJ.map(s=>`<button class="qs" style="--c:${col(s.id)}" data-ex="${s.id}"><span class="big">30</span><b>${esc(s.short)}</b><span>30 questions · 35 minutes</span></button>`).join("")}
   ${BY.acc?`<button class="qs" style="--c:${col("acc")}" data-ex="exfa"><span class="big">12</span><b>Sujet type FA (Moodle)</b><span>Les 12 QCM de l'examen type · 18 minutes</span></button>`:""}
   <button class="qs" data-ex="all"><span class="big">40</span><b>Toutes les matières</b><span>40 questions · 45 minutes</span></button>
   <button class="qs" data-ex="err" ${e?"":"disabled style='opacity:.5'"}><span class="big">${e}</span><b>Mes erreurs</b><span>Toutes matières, correction immédiate</span></button></div></div>`;
}
async function bindExam(){
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.ex;const ids=k==="all"||k==="err"?SUBJ.map(s=>s.id):k==="exfa"?["acc"]:[k];
    b.querySelector("b").textContent="Chargement…";await Promise.all(ids.map(load));
    let items,o;
    if(k==="exfa"){items=DATA.acc.qcm.map((q,i)=>[ "acc",i]).filter(([,i])=>DATA.acc.qcm[i][0]==="exfa");o={mode:"exam",title:"Sujet type FA",limit:18*60}}
    else if(k==="err"){items=shuffle(ids.flatMap(id=>errIds(id).map(i=>[id,i])));o={mode:"train",title:"Mes erreurs"}}
    else if(k==="all"){const per=ids.map(id=>shuffle(DATA[id].qcm.map((q,i)=>[id,i])));items=[];let j=0;while(items.length<40&&per.some(p=>p.length)){const p=per[j++%per.length];if(p.length)items.push(p.pop())}items=shuffle(items);o={mode:"exam",title:"Examen blanc",limit:45*60}}
    else{items=shuffle(DATA[k].qcm.map((q,i)=>[k,i])).slice(0,30);o={mode:"exam",title:"Examen blanc "+BY[k].short,limit:35*60}}
    startQuiz(items,o);drawQuiz($("#qz"))});
}

/* ---------- Devoirs ---------- */
const dvs=ST.get("dv2",{});
const dvFut=d=>new Date(d.date+"T"+d.time)>=new Date();
const nDev=()=>DEV.filter(dvFut).length;
const calDays=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((D(s)-t)/864e5)};
const rel=d=>{if(!dvFut(d))return "Passé";const n=calDays(d.date);return n===0?"Aujourd'hui":n===1?"Demain":`J−${n}`};
const urg=d=>dvFut(d)&&calDays(d.date)<=3;
const dvKeys=d=>[...d.qs.map((_,i)=>d.id+":q"+i),...(d.final||[]).map((_,i)=>d.id+":f"+i)];
const dvProg=d=>{const k=dvKeys(d);return [k.filter(x=>dvs[x]).length,k.length]};
const dvSorted=()=>{const f=DEV.filter(dvFut).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),p=DEV.filter(d=>!dvFut(d)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return [f,p]};
function devoirs(id){
  const [f,p]=dvSorted();const wide=matchMedia("(min-width:861px)").matches;
  const cur=DEV.find(d=>d.id===id)||(wide?(f[0]||p[0]):null);
  const item=d=>{const [a,n]=dvProg(d);return `<a class="dvi${cur&&cur.id===d.id?" on":""}${dvFut(d)?"":" past"}" href="#/devoirs/${d.id}" style="--c:${col(d.sub)}">
    <span class="dvi-d"><b>${D(d.date).getDate()}</b><small>${D(d.date).toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}</small></span>
    <span class="dvi-t"><small>${esc(BY[d.sub].short)} · ${esc(d.kind)}</small><b>${esc(d.t)}</b><span class="mini"><i style="width:${n?a/n*100:0}%"></i></span></span>
    <span class="due${urg(d)?" hot":""}">${rel(d)}</span></a>`};
  return `<div class="hello"><div class="eyebrow">Case studies, exposés, projets</div><h1>Devoirs</h1><p>${f.length} à rendre${f[0]?` · le prochain : <b>${esc(rel(f[0]).toLowerCase())}</b>`:""}</p></div>
  <div class="dvl${id?" has":""}"><aside class="dvlist">${f.map(item).join("")}${p.length?`<div class="dvsep">Passés</div>${p.map(item).join("")}`:""}</aside>
  <section class="dvd">${cur?dvDetail(cur):""}</section></div>`;
}
function dvDetail(d){
  const [a,n]=dvProg(d);const pre=d.qp||"";
  const chk=(k,cls,inner)=>`<li class="${cls}${dvs[k]?" done":""}"><button class="tick" data-k="${k}" aria-pressed="${!!dvs[k]}" aria-label="Marquer comme fait"></button>${inner}</li>`;
  return `<article class="dvx" style="--c:${col(d.sub)}">
  <a class="back" href="#/devoirs">← Tous les devoirs</a>
  <header class="dvh"><div class="row"><span class="tag">${esc(BY[d.sub].name)}</span><span class="tag ghost">${esc(d.kind)}</span></div>
   <h2>${esc(d.t)}</h2>
   <div class="facts"><div><span class="lbl">Échéance</span><b>${fmt(d.date,{weekday:"long",day:"numeric",month:"long"})} · ${d.time.replace(":","h")}</b></div><div><span class="lbl">Dans</span><b class="cd${urg(d)?" hot":""}">${rel(d)}</b></div><div><span class="lbl">Poids</span><b>${esc(d.weight)}</b></div><div><span class="lbl">Groupe</span><b>${esc(d.group)}</b></div></div>
   <div class="pg"><div class="bar"><i id="pgb" style="width:${n?a/n*100:0}%"></i></div><span class="mono" id="pgt">${a}/${n}</span></div></header>
  <p class="brief">${esc(d.brief)}</p>
  <div class="box"><span class="lbl">À rendre</span><p>${esc(d.rendu)}</p></div>
  ${d.note?`<div class="box warn"><span class="lbl">À noter</span><p>${esc(d.note)}</p></div>`:""}
  <h3 class="sec">${esc(d.qt||"L'énoncé")}</h3>
  <ol class="qlist">${d.qs.map((q,i)=>chk(d.id+":q"+i,"qi",`<div class="qb"><div class="qh"><span class="qn">${pre}${i+1}</span><b>${esc(q.t)}</b></div><p>${esc(q.d)}</p>${q.how?`<details class="how"><summary>Comment faire dans Enginius</summary><ol>${q.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol></details>`:""}</div>`)).join("")}</ol>
  ${d.tips?`<div class="tips"><h3 class="sec">${esc(d.tips.t)}</h3><ul>${d.tips.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  ${d.final&&d.final.length?`<h3 class="sec">Avant de rendre</h3><ul class="fin">${d.final.map((x,i)=>chk(d.id+":f"+i,"fi",`<span>${esc(x)}</span>`)).join("")}</ul>`:""}
  <h3 class="sec">Supports</h3>
  <div class="links">${d.links.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}<span>↗</span></a>`).join("")}</div>
  ${d.depot?`<a class="btn c depot" href="${esc(d.depot)}" target="_blank" rel="noopener">Déposer sur Moodle ↗</a>`:""}
  </article>`;
}
function bindDevoirs(){document.querySelectorAll(".dvx .tick").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(dvs[k])delete dvs[k];else dvs[k]=1;ST.set("dv2",dvs);
  b.closest("li").classList.toggle("done",!!dvs[k]);b.setAttribute("aria-pressed",!!dvs[k]);
  const d=DEV.find(x=>k.startsWith(x.id+":"));const [a,n]=dvProg(d);$("#pgb").style.width=a/n*100+"%";$("#pgt").textContent=a+"/"+n;
  const it=document.querySelector(`.dvi[href="#/devoirs/${d.id}"] .mini i`);if(it)it.style.width=a/n*100+"%"})}

/* ---------- Planning ---------- */
let pf="all";
function planning(){
  const list=AG.filter(e=>fut(e)&&(pf==="all"||e.sub===pf));let out="",wk="";
  list.forEach(e=>{const d=D(e.date),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const k=m.toISOString().slice(0,10);if(k!==wk){wk=k;out+=`<div class="week">Semaine du ${fmt(k,{day:"numeric",month:"long"})}</div>`}
    const nm=BY[e.sub]?BY[e.sub].short:e.sub;const tag=e.type==="due"?'<span class="pill red">À rendre</span>':e.type==="exam"?'<span class="pill red">Examen</span>':e.type==="quiz"?'<span class="pill amb">Quiz</span>':e.type==="prep"?'<span class="pill">À préparer</span>':"";
    out+=`<div class="li" style="--c:${BY[e.sub]?col(e.sub):"var(--muted)"}"><div class="d">${fmt(e.date)}<br>${e.time}</div><div class="s"></div><div class="w"><b>${esc(e.type==="class"?(BY[e.sub]?BY[e.sub].name:e.sub):e.t)}</b><small>${esc(e.type==="class"?e.t+" · "+e.room:nm)}</small></div>${tag}</div>`});
  return `<div class="hello"><div class="eyebrow">Semaine ${semWeek().n} sur ${semWeek().of}</div><h1>Planning</h1><p>Cours, rendus, quiz et examens à venir. Tout est aussi dans ton Calendrier Apple.</p></div>
  <div class="row" style="margin:0 0 14px"><span class="seg" id="pf"><button data-f="all" class="${pf==="all"?"on":""}">Tout</button>${SUBJ.map(s=>`<button data-f="${s.id}" class="${pf===s.id?"on":""}">${esc(s.short)}</button>`).join("")}</span></div>
  <div class="panel" style="overflow:hidden">${out||'<p class="muted" style="padding:16px 18px;margin:0">Rien à venir.</p>'}</div>`;
}
function bindPlanning(){document.querySelectorAll("#pf button").forEach(b=>b.onclick=()=>{pf=b.dataset.f;render()})}

render();
</script>
